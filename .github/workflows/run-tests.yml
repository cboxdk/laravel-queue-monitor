name: run-tests

on:
  pull_request:
    paths:
      - '**.php'
      - 'resources/css/**'
      - 'resources/dist/**'
      - 'resources/views/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  push:
    paths:
      - '**.php'
      - 'resources/css/**'
      - 'resources/dist/**'
      - 'resources/views/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Check dependency licenses
        run: composer license-check

      - name: Audit dependencies
        run: composer audit --no-dev

      - name: Generate SBOM
        run: composer sbom

      # The lock file is intentionally not committed for this library, so the
      # SBOM is published as a build artifact from CI's fresh resolve rather
      # than committed and drift-checked.
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard assets
        run: npm run build

      - name: Verify committed dashboard assets
        run: git diff --exit-code -- resources/dist/queue-monitor.css resources/dist/alpine.min.js resources/dist/echarts.min.js

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.4
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.4
            laravel: 12.*
            testbench: 10.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.3
            laravel: 12.*
            testbench: 10.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.4
            laravel: 11.*
            testbench: 9.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.3
            laravel: 11.*
            testbench: 9.*
            stability: prefer-stable
          # Lowest supported deps, to catch a rotted floor in a caret range.
          - os: ubuntu-latest
            php: 8.3
            laravel: 11.*
            testbench: 9.*
            stability: prefer-lowest

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, redis
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: php -d memory_limit=512M vendor/bin/pest --ci
